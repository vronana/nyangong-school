<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냥공스쿨 · 국어 오답노트</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-top: #14121f;
            --bg-bottom: #0c0b14;
            --surface: #262340;
            --surface-soft: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.11);
            --primary: #8b93ff;
            --primary-soft: rgba(139, 147, 255, 0.2);
            --success: #4ade80;
            --danger: #ff7a90;
            --gold: #f0c14b;
            --text: #f5f4fb;
            --text-muted: #a5a2c4;
        }

        body {
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            padding: 1.5rem 1rem 3rem;
            color: var(--text);
        }

        .wrap {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 26px;
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .sub {
            text-align: center;
            color: #a5a2c4;
            font-size: 14px;
            margin-bottom: 1.5rem;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            background: #262340;
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.15);
        }

        .stat-item { text-align: center; }
        .stat-num { font-size: 24px; font-weight: 700; color: var(--danger); }
        .stat-label { font-size: 12px; color: #a5a2c4; margin-top: 2px; }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #a5a2c4;
        }
        .empty-state .icon { font-size: 60px; margin-bottom: 1rem; }
        .empty-state a {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
            border: 1px solid var(--primary);
            padding: 10px 24px;
            border-radius: 24px;
        }

        .note-card {
            background: #262340;
            border-radius: 16px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--danger);
            transition: opacity 0.2s, filter 0.2s;
        }
        .note-card.locked {
            opacity: 0.7;
            filter: grayscale(0.4);
            border-left-color: #6f6c8c;
        }

        .note-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            margin-bottom: 0.6rem;
        }
        .note-date { font-size: 11px; color: #8985a8; margin-left: auto; }
        .lock-badge {
            font-size: 11px;
            font-weight: 700;
            color: #d0d0f0;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255,255,255,0.11);
            padding: 3px 10px;
            border-radius: 12px;
            white-space: nowrap;
        }

        .note-q {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 0.8rem;
            line-height: 1.5;
        }

        .note-answer-row {
            position: relative;
            display: flex;
            gap: 8px;
        }
        .note-text-input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.11);
            color: var(--text);
            font-family: inherit;
        }
        .note-text-input:focus { outline: none; border-color: var(--primary); }
        .note-submit-btn {
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            background: var(--primary);
            color: #0c0b14;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }
        .note-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .lock-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(10, 8, 20, 0.55);
            backdrop-filter: blur(1.5px);
            border-radius: 12px;
            cursor: pointer;
            z-index: 2;
        }
        .lock-overlay .lock-icon {
            font-size: 26px;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
        }
        .lock-overlay .lock-timer-text {
            font-size: 12px;
            font-weight: 700;
            color: #d0d0f0;
        }

        .note-feedback {
            margin-top: 0.6rem;
            font-size: 13px;
            font-weight: 600;
            min-height: 18px;
        }
        .note-feedback.wrong { color: #ff8899; }
        .note-feedback.correct { color: var(--success); }

        .bottom-actions {
            display: flex;
            gap: 10px;
            margin-top: 2rem;
        }
        .bottom-actions button, .bottom-actions a {
            flex: 1;
            text-align: center;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }
        .btn-home {
            background: #3a2a54;
            color: var(--text);
        }
        .home-float {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 150;
            background: rgba(45, 31, 61, 0.9);
            color: #8b93ff;
            border: 1px solid rgba(255,255,255,0.11);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }
        .version-tag {
            position: fixed;
            right: 10px;
            bottom: 6px;
            font-size: 10px;
            color: #a5a2c4;
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 8px;
            border-radius: 8px;
            z-index: 999;
            pointer-events: none;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #262340;
            border-radius: 20px;
            padding: 2rem 1.5rem;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 0.6rem; }
        .modal-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: #0c0b14;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="version-tag">v2026.10.01-22</div>
    <a href="korean-hub.html" class="home-float">🏠 홈</a>

    <div class="modal-overlay" id="answer-modal">
        <div class="modal-box">
            <div style="font-size:50px; margin-bottom:0.8rem;" id="answer-modal-icon">😸</div>
            <div class="modal-title" id="answer-modal-title" style="color:#8b93ff;"></div>
            <div style="font-size:13px; color:#a5a2c4; margin-bottom:1.2rem; line-height:1.7;" id="answer-modal-msg"></div>
            <button class="modal-btn" onclick="closeAnswerModal()">확인</button>
        </div>
    </div>

    <div class="wrap">
        <div class="header">📓 오답노트</div>
        <div class="sub">정답을 다시 입력해서 맞히면 자동으로 사라진다냥! 😸</div>
        <div class="sub" id="page-greeting" style="color:var(--primary); font-weight:600;"></div>

        <div id="content"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script>
        function updateGreeting() {
            try {
                const name = localStorage.getItem('sciencePlayerName_v2') || '';
                const el = document.getElementById('page-greeting');
                if (el) el.textContent = name ? `${name}님 반갑다${ny()}! 😸` : '';
            } catch (e) {}
        }
        updateGreeting();

        function getNotes() {
            try {
                return JSON.parse(localStorage.getItem('koreanWrongNotes_v2') || '[]');
            } catch (e) { return []; }
        }

        function saveNotes(notes) {
            localStorage.setItem('koreanWrongNotes_v2', JSON.stringify(notes));
        }

        // 말투를 매번 "~냥"으로만 고정하지 않고 가끔 "~옹"도 섞어서 사용
        function ny() { return Math.random() < 0.5 ? '냥' : '옹'; }

        // 정답 비교: 띄어쓰기 차이만 허용
        function normalizeAnswer(s) {
            return String(s || '').replace(/\s+/g, '').trim();
        }

        let currentFilter = 'all';

        function render() {
            const notes = getNotes();
            const contentEl = document.getElementById('content');

            if (notes.length === 0) {
                contentEl.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🎉</div>
                        <div>아직 틀린 문제가 없다냥!</div>
                        <div style="font-size:13px; margin-top:6px; color:#8985a8;">퀴즈를 풀다가 틀리면 여기에 자동으로 저장되고,<br>여기서 다시 맞히면 사라진다냥.</div>
                        <a href="korean-hub.html">🎮 퀴즈 풀러 가기</a>
                    </div>
                `;
                return;
            }

            let statsHtml = `
                <div class="stats-bar">
                    <div class="stat-item"><div class="stat-num">${notes.length}</div><div class="stat-label">틀린 문제</div></div>
                </div>
            `;

            const filtered = notes.map((n, idx) => ({ ...n, idx })).reverse();

            let cardsHtml = '';
            filtered.forEach(note => {
                const dateStr = note.date ? new Date(note.date).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' }) : '';
                const locked = !!(note.lockedUntil && Date.now() < note.lockedUntil);

                const feedbackHtml = locked
                    ? `땡! 정답은 <b>${note.answer}</b> 이다${ny()} 😿<br><span id="lock-timer-${note.idx}" style="display:inline-block;margin-top:4px;color:#8985a8;"></span>`
                    : '';
                const lockBadgeHtml = locked ? `<span class="lock-badge" id="lock-badge-${note.idx}">🔒 잠김</span>` : '';
                const remainNow = locked ? Math.max(0, Math.ceil((note.lockedUntil - Date.now()) / 1000)) : 0;
                const lockOverlayHtml = locked
                    ? `<div class="lock-overlay" onclick="lockedClick(${note.idx})">
                            <span class="lock-icon">🔒</span>
                            <span class="lock-timer-text" id="lock-overlay-timer-${note.idx}">${remainNow}초</span>
                       </div>`
                    : '';
                const inputDisabled = locked ? 'disabled' : '';
                cardsHtml += `
                    <div class="note-card${locked ? ' locked' : ''}" id="note-card-${note.idx}">
                        <div class="note-meta">
                            <span class="note-date">${dateStr}</span>
                            ${lockBadgeHtml}
                        </div>
                        <div class="note-q">Q. ${note.question}</div>
                        <div class="note-answer-row">
                            <input type="text" class="note-text-input" id="note-input-${note.idx}" placeholder="정답 입력" ${inputDisabled}
                                onkeypress="if(event.key==='Enter'){ checkAnswer(${note.idx}); }">
                            <button type="button" class="note-submit-btn" ${inputDisabled} onclick="checkAnswer(${note.idx})">제출</button>
                            ${lockOverlayHtml}
                        </div>
                        <div class="note-feedback${locked ? ' wrong' : ''}" id="note-feedback-${note.idx}">${feedbackHtml}</div>
                    </div>
                `;
            });

            contentEl.innerHTML = statsHtml + cardsHtml;
        }

        function checkAnswer(idx) {
            const card = document.getElementById(`note-card-${idx}`);
            if (!card || card.dataset.solved === '1') return;

            const notes = getNotes();
            const note = notes[idx];
            if (!note) return;
            if (note.lockedUntil && Date.now() < note.lockedUntil) return; // 잠긴 문제는 무시

            const inputEl = document.getElementById(`note-input-${idx}`);
            const val = inputEl ? inputEl.value : '';
            if (!val.trim()) { alert('정답을 입력해주세요'); return; }

            const feedbackEl = document.getElementById(`note-feedback-${idx}`);

            if (normalizeAnswer(val) === normalizeAnswer(note.answer)) {
                card.dataset.solved = '1';
                if (inputEl) inputEl.disabled = true;
                const btn = card.querySelector('.note-submit-btn');
                if (btn) btn.disabled = true;
                feedbackEl.className = 'note-feedback correct';
                feedbackEl.textContent = `🎉 정답이다${ny()}!`;
                if (typeof recordReviewClear === 'function') recordReviewClear();

                showAnswerModal('🎉', '맞았습니다!', `정답: <b>${note.answer}</b><br><br>오답노트에서 삭제할게요`, () => {
                    const latest = getNotes();
                    const stillIdx = latest.findIndex(n =>
                        n.date === note.date && n.question === note.question && n.url === note.url
                    );
                    if (stillIdx !== -1) {
                        latest.splice(stillIdx, 1);
                    }
                    saveNotes(latest);
                    render();
                });
            } else {
                // 오답: 정답을 바로 보여주고, 1분 동안 이 문제를 다시 못 풀게 잠가서
                // 마구 찍어서 우연히 맞히는 걸 막음
                card.classList.add('locked');
                if (inputEl) inputEl.disabled = true;
                const btn = card.querySelector('.note-submit-btn');
                if (btn) btn.setAttribute('onclick', `lockedClick(${idx})`);

                const metaEl = card.querySelector('.note-meta');
                if (metaEl && !metaEl.querySelector('.lock-badge')) {
                    const badge = document.createElement('span');
                    badge.className = 'lock-badge';
                    badge.id = `lock-badge-${idx}`;
                    badge.textContent = '🔒 잠김';
                    metaEl.appendChild(badge);
                }

                const rowEl = card.querySelector('.note-answer-row');
                if (rowEl && !rowEl.querySelector('.lock-overlay')) {
                    const overlay = document.createElement('div');
                    overlay.className = 'lock-overlay';
                    overlay.setAttribute('onclick', `lockedClick(${idx})`);
                    overlay.innerHTML = `<span class="lock-icon">🔒</span><span class="lock-timer-text" id="lock-overlay-timer-${idx}">60초</span>`;
                    rowEl.appendChild(overlay);
                }

                const lockedUntil = Date.now() + 60 * 1000;
                const latest = getNotes();
                if (latest[idx]) {
                    latest[idx].lockedUntil = lockedUntil;
                    saveNotes(latest);
                }

                feedbackEl.className = 'note-feedback wrong';
                feedbackEl.innerHTML = `땡! 정답은 <b>${note.answer}</b> 이다${ny()} 😿<br><span id="lock-timer-${idx}" style="display:inline-block;margin-top:4px;color:#8985a8;"></span>`;

                showAnswerModal('😿', '틀렸습니다', `정답은 <b>${note.answer}</b> 이다${ny()}<br><br>⏱ 1분 동안 이 문제는 잠긴다${ny()}`, null);

                startLockTicker();
                tickLockTimers();
            }
        }

        let pendingModalClose = null;

        function showAnswerModal(icon, title, msgHtml, onClose) {
            const overlay = document.getElementById('answer-modal');
            if (!overlay) { if (typeof onClose === 'function') onClose(); return; }
            document.getElementById('answer-modal-icon').textContent = icon;
            document.getElementById('answer-modal-title').textContent = title;
            document.getElementById('answer-modal-msg').innerHTML = msgHtml;
            overlay.classList.add('show');
            pendingModalClose = onClose;
        }

        function closeAnswerModal() {
            const overlay = document.getElementById('answer-modal');
            if (overlay) overlay.classList.remove('show');
            const cb = pendingModalClose;
            pendingModalClose = null;
            if (typeof cb === 'function') cb();
        }

        let lockTickInterval = null;

        function formatRemain(ms) {
            const s = Math.max(0, Math.ceil(ms / 1000));
            return `⏱ ${s}초 후에 다시 풀 수 있어요`;
        }

        function lockedClick(idx) {
            const notes = getNotes();
            const note = notes[idx];
            if (!note || !note.lockedUntil) { render(); return; }
            const remain = note.lockedUntil - Date.now();
            if (remain <= 0) {
                delete note.lockedUntil;
                saveNotes(notes);
                render();
                return;
            }
            showAnswerModal('🔒', '아직 잠겨있어요', `${formatRemain(remain)}<br>조금 있다가 다시 풀어봐${ny()}`, null);
        }

        function tickLockTimers() {
            const notes = getNotes();
            let anyExpired = false;
            let changed = false;
            notes.forEach((note, idx) => {
                if (!note.lockedUntil) return;
                const remain = note.lockedUntil - Date.now();
                if (remain <= 0) {
                    delete note.lockedUntil;
                    anyExpired = true;
                    changed = true;
                } else {
                    const el = document.getElementById(`lock-timer-${idx}`);
                    if (el) el.textContent = formatRemain(remain);
                    const overlayEl = document.getElementById(`lock-overlay-timer-${idx}`);
                    if (overlayEl) overlayEl.textContent = `${Math.ceil(remain / 1000)}초`;
                }
            });
            if (changed) saveNotes(notes);
            if (anyExpired) render();
        }

        function startLockTicker() {
            if (lockTickInterval) return;
            lockTickInterval = setInterval(tickLockTimers, 1000);
        }

        render();
        startLockTicker();
        tickLockTimers();
    </script>
</body>
</html>
