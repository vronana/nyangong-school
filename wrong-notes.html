<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오답노트</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #00d4ff;
            --success: #00ff88;
            --danger: #ff4466;
            --text: #f0f0f0;
        }

        body {
            background: linear-gradient(135deg, #2d1f4e 0%, #1f1447 100%);
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            padding: 1.5rem 1rem 3rem;
            color: var(--text);
        }

        .wrap {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 26px;
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .sub {
            text-align: center;
            color: #b0b0ff;
            font-size: 14px;
            margin-bottom: 1.5rem;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            background: #2d1f3d;
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.15);
        }

        .stat-item { text-align: center; }
        .stat-num { font-size: 24px; font-weight: 700; color: var(--danger); }
        .stat-label { font-size: 12px; color: #b0b0ff; margin-top: 2px; }

        .filter-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .filter-btn {
            background: #2d1f3d;
            border: 1px solid #4a3a6a;
            color: #d0d0f0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: var(--primary);
            color: #1a1230;
            border-color: var(--primary);
            font-weight: 700;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #b0b0ff;
        }
        .empty-state .icon { font-size: 60px; margin-bottom: 1rem; }
        .empty-state a {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
            border: 1px solid var(--primary);
            padding: 10px 24px;
            border-radius: 24px;
        }

        .note-card {
            background: #2d1f3d;
            border-radius: 16px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--danger);
        }

        .note-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
        }
        .note-source {
            font-size: 11px;
            color: var(--primary);
            background: rgba(0, 212, 255, 0.12);
            padding: 3px 10px;
            border-radius: 12px;
        }
        .note-date { font-size: 11px; color: #8a8aa8; }

        .note-q {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 0.8rem;
            line-height: 1.5;
        }

        .note-option {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 5px;
            background: rgba(255,255,255,0.04);
            border: 1px solid transparent;
        }
        .note-option.my-wrong {
            background: rgba(255, 68, 102, 0.15);
            border-color: var(--danger);
            color: #ffb3c1;
        }
        .note-option.the-correct {
            background: rgba(0, 255, 136, 0.15);
            border-color: var(--success);
            color: #a3ffd6;
        }
        .note-option.my-wrong::before { content: "❌ 내 선택: "; font-weight: 700; }
        .note-option.the-correct::before { content: "✓ 정답: "; font-weight: 700; }

        .note-explain {
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px dashed #4a3a6a;
            font-size: 13px;
            color: #d0d0f0;
            line-height: 1.7;
        }

        .delete-btn {
            margin-top: 0.8rem;
            background: none;
            border: 1px solid #6a4a5a;
            color: #ff8899;
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            float: right;
        }
        .clearfix::after { content: ""; display: table; clear: both; }

        .bottom-actions {
            display: flex;
            gap: 10px;
            margin-top: 2rem;
        }
        .bottom-actions button, .bottom-actions a {
            flex: 1;
            text-align: center;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }
        .btn-home {
            background: #3a2a54;
            color: var(--text);
        }
        .btn-clear {
            background: rgba(255, 68, 102, 0.15);
            color: var(--danger);
            border: 1px solid var(--danger);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">📓 오답노트</div>
        <div class="sub">틀린 문제들을 모아서 복습해요, 😸</div>

        <div id="content"></div>
    </div>

    <script>
        function getNotes() {
            try {
                return JSON.parse(localStorage.getItem('scienceWrongNotes') || '[]');
            } catch (e) { return []; }
        }

        function saveNotes(notes) {
            localStorage.setItem('scienceWrongNotes', JSON.stringify(notes));
        }

        const pageNames = {
            'human-genetics.html': '🧬 사람의 유전',
            'genetics.html': '🧬 유전 원리 기초',
            'reproduction.html': '🧬 생식과 발생 기초',
            'energy.html': '⚡ 에너지 전환과 보존',
            'electricity.html': '💡 전기 에너지',
            'reproduction-genetics.html': '🧬 생식과 유전 종합',
            'energy-electricity.html': '⚡ 에너지·전기 종합',
            'advanced-all.html': '🔥 심화 총정리'
        };

        let currentFilter = 'all';

        function render() {
            const notes = getNotes();
            const contentEl = document.getElementById('content');

            if (notes.length === 0) {
                contentEl.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🎉</div>
                        <div>아직 틀린 문제가 없어요!</div>
                        <div style="font-size:13px; margin-top:6px; color:#8a8aa8;">퀴즈를 풀다가 틀리면 여기에 자동으로 저장돼요.</div>
                        <a href="index.html">🎮 퀴즈 풀러 가기</a>
                    </div>
                `;
                return;
            }

            // 통계
            const sources = [...new Set(notes.map(n => n.url))];
            let statsHtml = `
                <div class="stats-bar">
                    <div class="stat-item"><div class="stat-num">${notes.length}</div><div class="stat-label">틀린 문제</div></div>
                    <div class="stat-item"><div class="stat-num">${sources.length}</div><div class="stat-label">단원 수</div></div>
                </div>
            `;

            // 필터 버튼
            let filterHtml = `<div class="filter-bar">
                <button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">전체</button>`;
            sources.forEach(src => {
                const label = pageNames[src] || src;
                filterHtml += `<button class="filter-btn ${currentFilter === src ? 'active' : ''}" onclick="setFilter('${src}')">${label}</button>`;
            });
            filterHtml += `</div>`;

            // 필터링된 노트 (최신순)
            const filtered = notes
                .map((n, idx) => ({ ...n, idx }))
                .filter(n => currentFilter === 'all' || n.url === currentFilter)
                .reverse();

            let cardsHtml = '';
            filtered.forEach(note => {
                const dateStr = note.date ? new Date(note.date).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' }) : '';
                let optionsHtml = '';
                note.options.forEach((opt, i) => {
                    if (i === note.correctIdx) {
                        optionsHtml += `<div class="note-option the-correct">${opt}</div>`;
                    } else if (i === note.selectedIdx) {
                        optionsHtml += `<div class="note-option my-wrong">${opt}</div>`;
                    }
                });
                cardsHtml += `
                    <div class="note-card">
                        <div class="note-meta">
                            <span class="note-source">${pageNames[note.url] || note.page}</span>
                            <span class="note-date">${dateStr}</span>
                        </div>
                        <div class="note-q">Q. ${note.question}</div>
                        ${optionsHtml}
                        <div class="note-explain">💡 ${note.explanation}</div>
                        <div class="clearfix">
                            <button class="delete-btn" onclick="deleteNote(${note.idx})">삭제</button>
                        </div>
                    </div>
                `;
            });

            contentEl.innerHTML = statsHtml + filterHtml + cardsHtml + `
                <div class="bottom-actions">
                    <a href="index.html" class="btn-home">🏠 홈으로</a>
                    <button class="btn-clear" onclick="clearAll()">전체 삭제</button>
                </div>
            `;
        }

        function setFilter(f) {
            currentFilter = f;
            render();
        }

        function deleteNote(idx) {
            const notes = getNotes();
            notes.splice(idx, 1);
            saveNotes(notes);
            render();
        }

        function clearAll() {
            if (confirm('오답노트를 전부 삭제할까요?')) {
                localStorage.removeItem('scienceWrongNotes');
                currentFilter = 'all';
                render();
            }
        }

        render();
    </script>
</body>
</html>
