<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전기 에너지 심화</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #00d4ff;
            --primary-light: #4dd4ff;
            --accent: #00d4ff;
            --success: #00ff88;
            --danger: #ff4466;
            --bg: #2d1f3d;
            --text: #f0f0f0;
        }

        body {
            background: linear-gradient(135deg, #2d1f4e 0%, #1f1447 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Sans KR', sans-serif;
            padding: 1rem;
            color: var(--text);
        }

        .game-container {
            max-width: 500px;
            width: 100%;
            background: #2d1f3d;
            border: none;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 28px;
            color: #00d4ff;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .cat-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            padding: 0.8rem;
            background: transparent;
        }

        .cat-pixel {
            font-size: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cat-happy { animation: bounce 0.6s ease; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .cat-sad { animation: droop 0.6s ease; }
        @keyframes droop {
            0% { transform: translateY(0); }
            50% { transform: translateY(5px) rotateZ(-2deg); }
            100% { transform: translateY(0); }
        }

        .fish-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
        }

        .fish-display {
            display: flex;
            justify-content: center;
            gap: 3px;
            flex-wrap: wrap;
            min-height: 40px;
            align-content: flex-start;
        }

        .fish {
            font-size: 28px;
            animation: popIn 0.4s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .question-box {
            background: transparent;
            border: none;
            border-radius: 15px;
            padding: 1.2rem;
            padding-left: 0;
            padding-right: 0;
            margin-bottom: 1rem;
        }

        .progress {
            font-size: 12px;
            color: var(--primary);
            margin-bottom: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 20px;
            margin-bottom: 1.2rem;
            line-height: 1.8;
            color: #f0f0f0;
            font-weight: 600;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1.2rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: rgba(0, 212, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
            color: #f0f0f0;
        }

        .option:hover {
            background: rgba(0, 212, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.15);
        }

        .option input[type="radio"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .option.correct {
            background: rgba(0, 255, 136, 0.2);
        }

        .option.incorrect {
            background: rgba(255, 68, 102, 0.2);
        }

        .option.disabled {
            pointer-events: none;
        }

        .feedback {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 14px;
            line-height: 1.6;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
            border-left: 4px solid var(--success);
        }

        .feedback.incorrect {
            background: rgba(255, 68, 102, 0.15);
            color: #ff8899;
            border-left: 4px solid var(--danger);
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            padding: 16px;
            border: none;
            background: linear-gradient(135deg, #00d4ff 0%, #00b8d4 100%);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }

        button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.5);
        }

        button:active:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 2px 10px rgba(0, 212, 255, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .game-over {
            text-align: center;
            display: none;
        }

        /* 만점 축하 오버레이 */
        #perfect-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 300;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        #perfect-overlay.show { display: flex; }

        .perfect-box {
            text-align: center;
            animation: zoomIn 0.5s ease;
        }
        @keyframes zoomIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .perfect-title {
            font-size: 36px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255,215,0,0.8);
            margin-bottom: 0.5rem;
            animation: glow 1s ease infinite alternate;
        }
        @keyframes glow {
            0% { text-shadow: 0 0 10px rgba(255,215,0,0.5); }
            100% { text-shadow: 0 0 30px rgba(255,215,0,1), 0 0 60px rgba(255,215,0,0.5); }
        }

        .perfect-sub {
            font-size: 18px;
            color: #fff;
            margin-bottom: 1.5rem;
        }

        .perfect-cat {
            font-size: 80px;
            animation: superBounce 0.4s ease infinite alternate;
            display: block;
            margin-bottom: 1rem;
        }
        @keyframes superBounce {
            0% { transform: translateY(0) scale(1) rotate(-5deg); }
            100% { transform: translateY(-20px) scale(1.1) rotate(5deg); }
        }

        .perfect-btn {
            margin-top: 1.5rem;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a1a;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255,215,0,0.5);
        }

        /* 폭죽 파티클 */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: fall linear forwards;
            z-index: 299;
            pointer-events: none;
        }
        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .final-score {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary);
            margin: 2rem 0 1.5rem 0;
        }

        .final-message {
            font-size: 16px;
            color: #f0f0f0;
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        .fish-total {
            font-size: 24px;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        /* 고양이 축하 애니메이션 */
        .cat-celebrate {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0px;
            margin: 1rem 0;
            font-size: 64px;
        }

        .celebrate-cat {
            display: inline-block;
            animation: catBounce 0.5s ease infinite alternate;
        }

        .celebrate-fish {
            display: inline-block;
            animation: fishWiggle 0.4s ease infinite alternate;
            transform-origin: center bottom;
        }

        @keyframes catBounce {
            0% { transform: translateY(0) rotate(-5deg); }
            100% { transform: translateY(-12px) rotate(5deg); }
        }

        @keyframes fishWiggle {
            0% { transform: rotate(-15deg) translateY(0px); }
            100% { transform: rotate(15deg) translateY(-8px); }
        }

        .fish-total-display {
            display: flex;
            justify-content: center;
            gap: 3px;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        #quiz-section { display: none; }
        #game-over-section { display: none; }

        /* 모달 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-box {
            background: #2d1f3d;
            border-radius: 20px;
            padding: 2rem 1.5rem;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
            animation: popUp 0.3s ease;
        }
        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-icon { font-size: 60px; margin-bottom: 1rem; }
        .modal-title { font-size: 22px; font-weight: 700; margin-bottom: 1rem; }
        .modal-title.correct { color: #00ff88; }
        .modal-title.incorrect { color: #ff4466; }
        .modal-explanation {
            font-size: 15px;
            color: #d0d0f0;
            line-height: 1.8;
            margin-bottom: 1.5rem;
        }
        .modal-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
        }

        .fixed-btn-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            padding: 12px 1.5rem;
            background: #2d1f3d;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
            display: none;
            z-index: 100;
        }

        @media (max-width: 480px) {
            .game-container { padding: 1rem; }
            .header { font-size: 24px; }
            .question-text { font-size: 18px; }
            .option { font-size: 15px; padding: 12px; }
            button { font-size: 15px; padding: 14px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">🔥 전기 에너지 심화 🔥</div>


        <!-- 이름 입력 팝업 -->
        <div class="modal-overlay" id="name-modal">
            <div class="modal-box">
                <div style="font-size:50px; margin-bottom:0.8rem;">😸</div>
                <div class="modal-title" style="color:#00d4ff;">이름(별명)을 알려줘!</div>
                <div style="font-size:13px; color:#b0b0ff; margin-bottom:1rem;">랭킹에 이 이름으로 표시돼요 🏆</div>
                <input type="text" id="name-input" placeholder="예: 나나" maxlength="10"
                    onkeypress="if(event.key==='Enter') confirmName()"
                    style="width:100%; padding:12px; border-radius:10px; border:1px solid #4a3a6a; background:#1f1730; color:#f0f0f0; font-size:15px; margin-bottom:1rem; text-align:center; box-sizing:border-box;">
                <button class="modal-btn" onclick="confirmName()">확인</button>
            </div>
        </div>

        <!-- 시작 화면 -->
        <div id="start-section" style="text-align: center; padding: 2rem 0;">
            <div style="font-size: 80px; margin-bottom: 1rem;">😼</div>
            <div style="font-size: 16px; color: #b0b0ff; margin-bottom: 2rem; line-height: 1.8;">중학교 과학 중간고사 준비!<br>🔥 전기 에너지 심화 문제 (3단계, 계산 포함)</div>
            <button onclick="startGame()" style="font-size: 20px; padding: 18px 40px;">🎮 게임 시작!</button>
            <div style="margin-top: 1rem;"><a href="wrong-notes.html" style="color:#00d4ff; font-size:13px; text-decoration:none; border-bottom:1px dashed #00d4ff;">📓 오답노트 보기</a></div>
        </div>

        <div id="quiz-section" style="display:none;">
            <div id="player-greeting" style="text-align:center; font-size:13px; color:#00d4ff; margin-bottom:0.6rem; font-weight:600;"></div>
            <div class="cat-section">
                <div class="cat-pixel" id="cat">😸</div>
                <div class="fish-section">
                    <div class="fish-display" id="fishDisplay"></div>
                </div>
            </div>

            <div class="question-box">
                <div class="progress">
                    <span id="current-q">1</span> / <span id="total-q">10</span>
                </div>
                <div class="question-text" id="question"></div>
                <div class="options" id="options"></div>
                <div style="height: 70px;"></div>
            </div>
        </div>

        <!-- 정답/오답 모달 -->
        <div class="modal-overlay" id="feedback-modal">
            <div class="modal-box">
                <div class="modal-icon" id="modal-icon"></div>
                <div class="modal-title" id="modal-title"></div>
                <div class="modal-explanation" id="modal-explanation"></div>
                <button class="modal-btn" onclick="closeModal()">다음 문제 →</button>
            </div>
        </div>

        <div class="fixed-btn-bar" id="fixed-btn-bar">
            <div class="button-group">
                <button id="submit-btn" onclick="submitAnswer()">정답 제출</button>
            </div>
        </div>

        <div id="game-over-section" class="game-over">
            <div class="header" style="margin-bottom: 1rem;">🎉 게임 종료! 🎉</div>

            <!-- 고양이 물고기 애니메이션 -->
            <div class="cat-celebrate" id="cat-celebrate">
                <span class="celebrate-cat">😸</span>
                <span class="celebrate-fish">🐟</span>
            </div>

            <div class="final-score" id="final-score">0 / 10</div>
            <div class="fish-total">모은 물고기</div>
            <div class="fish-total-display" id="fishTotal"></div>
            <div class="final-message" id="final-message"></div>
            <button onclick="resetGame()">다시 시작하기</button>
        </div>
    </div>

    <!-- 만점 축하 오버레이 -->
    <div id="perfect-overlay">
        <div class="perfect-box">
            <span class="perfect-cat">🏆😸🐟</span>
            <div class="perfect-title">🎉 만점 달성! 🎉</div>
            <div class="perfect-sub">축하합니다! 완벽해요! 🌟</div>
            <div style="font-size: 14px; color: #b0b0ff; line-height: 1.8;">과학 천재 등극! 고양이도 너무 기뻐요!</div>
            <button class="perfect-btn" onclick="closePerfect()">🎮 다시 도전하기</button>
        </div>
    </div>

    <!-- 배경음악 -->
    <audio id="bgmAudio" loop>
        <source src="PixelPulse.mp3" type="audio/mpeg">
    </audio>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script>
        const bgmAudio = document.getElementById('bgmAudio');
        bgmAudio.volume = 0.3;

        function getSavedName() {
            try { return localStorage.getItem('sciencePlayerName_v2') || ''; }
            catch (e) { return ''; }
        }

        function updateGreeting() {
            const name = getSavedName();
            const el = document.getElementById('player-greeting');
            if (el) el.textContent = name ? `${name}님, 화이팅! 🔥` : '';
        }

        function initNameGate() {
            const existing = localStorage.getItem('sciencePlayerName_v2');
            if (!existing) {
                document.getElementById('name-modal').classList.add('show');
            }
        }

        function confirmName() {
            const input = document.getElementById('name-input');
            const val = input.value.trim();
            if (!val) { alert('이름을 입력해줘!'); return; }
            localStorage.setItem('sciencePlayerName_v2', val);
            document.getElementById('name-modal').classList.remove('show');
            updateGreeting();
        }

        initNameGate();

        function startGame() {
            updateGreeting();
            document.getElementById('start-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            document.getElementById('fixed-btn-bar').style.display = 'block';
            bgmAudio.play().catch(e => console.log('음악 재생 실패:', e));
            loadQuestion();
        }

        const questions = [
            {
                q: "220V-1000W 전자레인지를 220V에 연결했을 때 흐르는 전류는?",
                options: ["2.5A", "약 4.5A", "5A", "10A"],
                correct: 1,
                explanation: "전류 = 전력÷전압 = 1000W÷220V ≈ 4.5A입니다."
            },
            {
                q: "위 전자레인지(전류 약 4.5A)의 저항은 약 몇 Ω인가?",
                options: ["약 49Ω", "약 110Ω", "약 220Ω", "약 440Ω"],
                correct: 0,
                explanation: "저항 = 전압÷전류 = 220V÷4.5A ≈ 49Ω입니다."
            },
            {
                q: "소비 전력 2000W인 에어컨을 하루 3시간씩 10일 사용했을 때 총 전력량은 몇 kWh인가?",
                options: ["6kWh", "30kWh", "60kWh", "200kWh"],
                correct: 2,
                explanation: "전력량 = 2kW × 3h × 10일 = 60kWh입니다."
            },
            {
                q: "1kWh당 전기 요금이 200원이라고 할 때, 위 에어컨을 10일간 사용한 전기 요금은?",
                options: ["6,000원", "12,000원", "60,000원", "200,000원"],
                correct: 1,
                explanation: "60kWh × 200원 = 12,000원입니다."
            },
            {
                q: "100V-200W 전열기 두 개를 병렬로 연결하여 동시에 사용하면 전체 소비 전력은?",
                options: ["100W", "200W", "400W", "800W"],
                correct: 2,
                explanation: "병렬연결에서는 각 전열기가 원래 소비 전력대로 동작하므로 200W+200W = 400W입니다."
            },
            {
                q: "같은 전압에서 두 전열기(200W, 800W)를 비교할 때 저항이 더 큰 것은?",
                options: ["200W 전열기", "800W 전열기", "둘 다 같다", "알 수 없다"],
                correct: 0,
                explanation: "전압이 일정할 때 저항은 전력에 반비례하므로(저항=전압²÷전력), 전력이 작은 200W 전열기의 저항이 더 큽니다."
            },
            {
                q: "220V-440W 전열기를 매일 2시간씩 30일 사용했을 때 총 전력량(kWh)은?",
                options: ["13.2kWh", "26.4kWh", "44kWh", "88kWh"],
                correct: 1,
                explanation: "전력량 = 0.44kW × 2h × 30일 = 26.4kWh입니다."
            },
            {
                q: "발전기 코일의 감은 수를 2배로 늘리고 자석의 세기와 회전 속도를 그대로 유지하면 유도 전류의 세기는?",
                options: ["1/2배", "그대로", "2배", "4배"],
                correct: 2,
                explanation: "코일의 감은 수가 많을수록 유도 전류가 세지므로, 감은 수가 2배가 되면 유도 전류의 세기도 2배가 됩니다."
            },
            {
                q: "220V 전원에서 저항이 55Ω인 전열기의 소비 전력은?",
                options: ["440W", "550W", "880W", "1100W"],
                correct: 2,
                explanation: "전류 = 220V÷55Ω = 4A, 소비 전력 = 220V × 4A = 880W입니다."
            },
            {
                q: "전기 에너지가 100% 열에너지로 전환된다고 가정할 때, 220V-1100W 전기밥솥을 10분(1/6시간) 사용하면 발생하는 열에너지(J)는? (전기 에너지 = 전력×시간(초))",
                options: ["110,000J", "220,000J", "660,000J", "1,100,000J"],
                correct: 2,
                explanation: "10분 = 600초이므로 전기 에너지 = 1100W × 600s = 660,000J입니다."
            }
        ];

        let currentQuestion = 0;
        let correctCount = 0;
        let fishCount = 0;
        let answered = false;
        let selectedOption = null;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question').textContent = q.q;
            document.getElementById('current-q').textContent = currentQuestion + 1;
            document.getElementById('total-q').textContent = questions.length;

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const label = document.createElement('label');
                label.className = 'option';
                label.innerHTML = `
                    <input type="radio" name="answer" value="${idx}" onchange="selectOption(${idx})">
                    <span>${opt}</span>
                `;
                optionsDiv.appendChild(label);
            });

            document.getElementById('submit-btn').style.display = 'block';
            answered = false;
            selectedOption = null;
        }

        function selectOption(idx) {
            selectedOption = idx;
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function tone(freq, start, dur, vol = 0.28, type = 'triangle') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + start);
            gain.gain.setValueAtTime(0, audioCtx.currentTime + start);
            gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + start + 0.01);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime + start + dur - 0.05);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + start + dur);
            osc.start(audioCtx.currentTime + start);
            osc.stop(audioCtx.currentTime + start + dur + 0.01);
        }

        function playCorrect() {
            audioCtx.resume();
            tone(523, 0,    0.12, 0.25, 'triangle');
            tone(659, 0.1,  0.12, 0.25, 'triangle');

            tone(659, 0.1,  0.12, 0.1,  'sine');
            tone(784, 0.2,  0.25, 0.12, 'sine');
        }

            tone(850, 0.05, 0.05, 0.07, 'square');
            tone(800, 0.1,  0.05, 0.06, 'square');
        }

        let perfectTimeout = null;
        function stopPerfect() {
            if (perfectTimeout) { clearTimeout(perfectTimeout); perfectTimeout = null; }
        }

        function saveWrongAnswer(q, selected) {
            try {
                const notes = JSON.parse(localStorage.getItem('scienceWrongNotes_v2') || '[]');
                notes.push({
                    page: document.title,
                    url: location.pathname.split('/').pop(),
                    question: q.q,
                    options: q.options,
                    correctIdx: q.correct,
                    selectedIdx: selected,
                    explanation: q.explanation,
                    date: new Date().toISOString()
                });
                localStorage.setItem('scienceWrongNotes_v2', JSON.stringify(notes));
            } catch (e) { console.log('오답노트 저장 실패:', e); }
        }

        function submitAnswer() {
            if (selectedOption === null) {
                alert('선택지를 선택해주세요');
                return;
            }

            const q = questions[currentQuestion];
            const isCorrect = selectedOption === q.correct;
            const catEl = document.getElementById('cat');
            const options = document.querySelectorAll('.option');

            if (isCorrect) {
                correctCount++;
                fishCount++;
                catEl.textContent = '😸';
                catEl.classList.add('cat-happy');
                catEl.classList.remove('cat-sad');

                const fishDisplay = document.getElementById('fishDisplay');
                const fish = document.createElement('span');
                fish.className = 'fish';
                fish.textContent = '🐟';
                fishDisplay.appendChild(fish);

                document.getElementById('modal-icon').textContent = '😸';
                document.getElementById('modal-title').textContent = (getSavedName() ? getSavedName() + '님, ' : '') + '✓ 정답입니다!';
                document.getElementById('modal-title').className = 'modal-title correct';
                playCorrect();
            } else {
                catEl.textContent = '😿';
                catEl.classList.add('cat-sad');
                catEl.classList.remove('cat-happy');

                document.getElementById('modal-icon').textContent = '😿';
                document.getElementById('modal-title').textContent = (getSavedName() ? getSavedName() + '님, ' : '') + '✗ 오답입니다';
                document.getElementById('modal-title').className = 'modal-title incorrect';
                playWrong();
                saveWrongAnswer(q, selectedOption);
            }

            options.forEach((opt, idx) => {
                opt.classList.add('disabled');
                if (idx === q.correct) opt.classList.add('correct');
                else if (idx === selectedOption && !isCorrect) opt.classList.add('incorrect');
            });

            document.getElementById('modal-explanation').textContent = q.explanation;
            document.getElementById('feedback-modal').classList.add('show');
            document.getElementById('submit-btn').style.display = 'none';
            answered = true;
        }

        function closeModal() {
            document.getElementById('feedback-modal').classList.remove('show');
            document.getElementById('submit-btn').style.display = 'block';
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }


        function markQuizComplete() {
            try {
                const progress = JSON.parse(localStorage.getItem('scienceQuizProgress_v2') || '{}');
                progress[location.pathname.split('/').pop()] = true;
                localStorage.setItem('scienceQuizProgress_v2', JSON.stringify(progress));
            } catch (e) { console.log('진도 저장 실패:', e); }
        }

        function endGame() {
            markQuizComplete();
            submitScore(location.pathname.split('/').pop(), '전기 에너지 심화', correctCount, questions.length);
            document.getElementById('quiz-section').style.display = 'none';
            document.getElementById('fixed-btn-bar').style.display = 'none';
            document.getElementById('game-over-section').style.display = 'block';

            document.getElementById('final-score').textContent = correctCount + ' / ' + questions.length;

            // 물고기 표시
            const fishTotalDiv = document.getElementById('fishTotal');
            fishTotalDiv.innerHTML = '';
            for (let i = 0; i < fishCount; i++) {
                const fish = document.createElement('span');
                fish.className = 'fish';
                fish.textContent = '🐟';
                fishTotalDiv.appendChild(fish);
            }

            // 만점이면 특별 축하!
            if (correctCount === questions.length) {
                playPerfect();
                setTimeout(() => {
                    launchConfetti();
                    document.getElementById('perfect-overlay').classList.add('show');
                }, 600);
                return;
            }

            let message = '';
            if (correctCount >= questions.length * 0.8) {
                message = '훌륭합니다! 📚 과학을 정말 잘 이해하고 있네요.\n중간고사에서 좋은 성적을 기대해요!';
            } else if (correctCount >= questions.length * 0.6) {
                message = '좋습니다! 💪 좀 더 복습하면 더 잘할 수 있어요.\n중요한 개념들을 다시 한번 정리해봐요!';
            } else {
                message = '화이팅! ✨ 다시 한 번 도전해보세요.\n어려운 부분들을 다시 공부해봅시다!';
            }
            document.getElementById('final-message').textContent = message;
        }

        function launchConfetti() {
            const colors = ['#ffd700','#ff4466','#00d4ff','#00ff88','#ff8c00','#ff69b4','#7fff00'];
            for (let i = 0; i < 80; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'confetti';
                    el.style.left = Math.random() * 100 + 'vw';
                    el.style.background = colors[Math.floor(Math.random() * colors.length)];
                    el.style.width = (Math.random() * 8 + 6) + 'px';
                    el.style.height = (Math.random() * 8 + 6) + 'px';
                    el.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                    el.style.animationDelay = '0s';
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 4000);
                }, i * 40);
            }
        }

        function closePerfect() {
            stopPerfect();
            document.getElementById('perfect-overlay').classList.remove('show');
            resetGame();
        }

        function resetGame() {
            currentQuestion = 0;
            correctCount = 0;
            fishCount = 0;
            answered = false;
            selectedOption = null;
            document.getElementById('start-section').style.display = 'block';
            document.getElementById('quiz-section').style.display = 'none';
            document.getElementById('game-over-section').style.display = 'none';
            document.getElementById('fishDisplay').innerHTML = '';
        }
    </script>
</body>
</html>
