<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냥공스쿨 · 과학 오답노트</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #00d4ff;
            --success: #00ff88;
            --danger: #ff4466;
            --text: #f0f0f0;
        }

        body {
            background: linear-gradient(135deg, #2d1f4e 0%, #1f1447 100%);
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            padding: 1.5rem 1rem 3rem;
            color: var(--text);
        }

        .wrap {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 26px;
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .sub {
            text-align: center;
            color: #b0b0ff;
            font-size: 14px;
            margin-bottom: 1.5rem;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            background: #2d1f3d;
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.15);
        }

        .stat-item { text-align: center; }
        .stat-num { font-size: 24px; font-weight: 700; color: var(--danger); }
        .stat-label { font-size: 12px; color: #b0b0ff; margin-top: 2px; }

        .filter-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .filter-btn {
            background: #2d1f3d;
            border: 1px solid #4a3a6a;
            color: #d0d0f0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: var(--primary);
            color: #1a1230;
            border-color: var(--primary);
            font-weight: 700;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #b0b0ff;
        }
        .empty-state .icon { font-size: 60px; margin-bottom: 1rem; }
        .empty-state a {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
            border: 1px solid var(--primary);
            padding: 10px 24px;
            border-radius: 24px;
        }

        .note-card {
            background: #2d1f3d;
            border-radius: 16px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--danger);
        }

        .note-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
        }
        .note-source {
            font-size: 11px;
            color: var(--primary);
            background: rgba(0, 212, 255, 0.12);
            padding: 3px 10px;
            border-radius: 12px;
        }
        .note-date { font-size: 11px; color: #8a8aa8; }

        .note-q {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 0.8rem;
            line-height: 1.5;
        }

        .note-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .note-option-btn {
            width: 100%;
            text-align: left;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #4a3a6a;
            color: var(--text);
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
        }
        .note-option-btn:hover { border-color: var(--primary); }
        .note-option-btn.wrong-pick {
            background: rgba(255, 68, 102, 0.2);
            border-color: var(--danger);
            color: #ffb3c1;
            animation: shakeIt 0.3s;
        }
        .note-option-btn.correct-pick {
            background: rgba(0, 255, 136, 0.2);
            border-color: var(--success);
            color: #a3ffd6;
        }
        .note-option-btn:disabled { cursor: default; }
        @keyframes shakeIt {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .note-feedback {
            margin-top: 0.6rem;
            font-size: 13px;
            font-weight: 600;
            min-height: 18px;
        }
        .note-feedback.wrong { color: #ff8899; }
        .note-feedback.correct { color: var(--success); }

        .note-explain {
            margin-top: 0.6rem;
            padding-top: 0.6rem;
            border-top: 1px dashed #4a3a6a;
            font-size: 13px;
            color: #d0d0f0;
            line-height: 1.7;
        }

        .bottom-actions {
            display: flex;
            gap: 10px;
            margin-top: 2rem;
        }
        .bottom-actions button, .bottom-actions a {
            flex: 1;
            text-align: center;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }
        .btn-home {
            background: #3a2a54;
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">📓 오답노트</div>
        <div class="sub">문제를 다시 풀어서 정답을 맞히면 자동으로 사라진다냥! 😸</div>
        <div class="sub" id="page-greeting" style="color:var(--primary); font-weight:600;"></div>

        <div id="content"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script>
        function updateGreeting() {
            try {
                const name = localStorage.getItem('sciencePlayerName_v2') || '';
                const el = document.getElementById('page-greeting');
                if (el) el.textContent = name ? `${name}님 반갑다냥! 😸` : '';
            } catch (e) {}
        }
        updateGreeting();

        function getNotes() {
            try {
                return JSON.parse(localStorage.getItem('scienceWrongNotes_v2') || '[]');
            } catch (e) { return []; }
        }

        function saveNotes(notes) {
            localStorage.setItem('scienceWrongNotes_v2', JSON.stringify(notes));
        }

        const pageNames = {
            'human-genetics.html': '🧬 사람의 유전',
            'genetics.html': '🧬 유전 원리 기초',
            'reproduction.html': '🧬 생식과 발생 기초',
            'energy.html': '⚡ 에너지 전환과 보존',
            'electricity.html': '💡 전기 에너지',
            'reproduction-genetics.html': '🧬 생식과 유전 종합',
            'energy-electricity.html': '⚡ 에너지·전기 종합',
            'advanced-all.html': '🔥 심화 총정리',
            'stage2-review.html': '🌟 단원 통합 모음',
            'reproduction-adv.html': '🧬 생식과 발생 응용',
            'reproduction-master.html': '🧬 생식과 발생 심화',
            'genetics-adv.html': '🧬 유전 원리 응용',
            'genetics-master.html': '🧬 유전 원리 심화',
            'human-genetics-adv.html': '🧬 사람의 유전 응용',
            'human-genetics-master.html': '🧬 사람의 유전 심화',
            'energy-adv.html': '⚡ 에너지 전환과 보존 응용',
            'energy-master.html': '⚡ 에너지 전환과 보존 심화',
            'electricity-adv.html': '💡 전기 에너지 응용',
            'electricity-master.html': '💡 전기 에너지 심화',
            'main-quiz.html': '🎮 전체 종합 퀴즈'
        };

        let currentFilter = 'all';

        function render() {
            const notes = getNotes();
            const contentEl = document.getElementById('content');

            if (notes.length === 0) {
                contentEl.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🎉</div>
                        <div>아직 틀린 문제가 없다냥!</div>
                        <div style="font-size:13px; margin-top:6px; color:#8a8aa8;">퀴즈를 풀다가 틀리면 여기에 자동으로 저장되고,<br>여기서 다시 맞히면 사라진다냥.</div>
                        <a href="science-hub.html">🎮 퀴즈 풀러 가기</a>
                    </div>
                `;
                return;
            }

            // 통계
            const sources = [...new Set(notes.map(n => n.url))];
            let statsHtml = `
                <div class="stats-bar">
                    <div class="stat-item"><div class="stat-num">${notes.length}</div><div class="stat-label">틀린 문제</div></div>
                    <div class="stat-item"><div class="stat-num">${sources.length}</div><div class="stat-label">단원 수</div></div>
                </div>
            `;

            // 필터 버튼
            let filterHtml = `<div class="filter-bar">
                <button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">전체</button>`;
            sources.forEach(src => {
                const label = pageNames[src] || src;
                filterHtml += `<button class="filter-btn ${currentFilter === src ? 'active' : ''}" onclick="setFilter('${src}')">${label}</button>`;
            });
            filterHtml += `</div>`;

            // 필터링된 노트 (최신순)
            const filtered = notes
                .map((n, idx) => ({ ...n, idx }))
                .filter(n => currentFilter === 'all' || n.url === currentFilter)
                .reverse();

            let cardsHtml = '';
            filtered.forEach(note => {
                const dateStr = note.date ? new Date(note.date).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' }) : '';
                const locked = !!(note.lockedUntil && Date.now() < note.lockedUntil);
                let optionsHtml = '';
                note.options.forEach((opt, i) => {
                    const isAnswer = locked && i === note.correctIdx;
                    optionsHtml += `<button type="button" class="note-option-btn${isAnswer ? ' correct-pick' : ''}" ${locked ? 'disabled' : ''} onclick="checkAnswer(${note.idx}, ${i}, this)">${opt}</button>`;
                });
                const feedbackHtml = locked
                    ? `땡! 정답은 <b>${note.options[note.correctIdx]}</b> 이다냥 😿<br>💡 ${note.explanation}<br><span id="lock-timer-${note.idx}" style="display:inline-block;margin-top:4px;color:#8a8aa8;"></span>`
                    : '';
                cardsHtml += `
                    <div class="note-card" id="note-card-${note.idx}">
                        <div class="note-meta">
                            <span class="note-source">${pageNames[note.url] || note.page}</span>
                            <span class="note-date">${dateStr}</span>
                        </div>
                        <div class="note-q">Q. ${note.question}</div>
                        <div class="note-options">${optionsHtml}</div>
                        <div class="note-feedback${locked ? ' wrong' : ''}" id="note-feedback-${note.idx}">${feedbackHtml}</div>
                    </div>
                `;
            });

            contentEl.innerHTML = statsHtml + filterHtml + cardsHtml + `
                <div class="bottom-actions">
                    <a href="science-hub.html" class="btn-home">🏠 홈으로</a>
                </div>
            `;
        }

        function setFilter(f) {
            currentFilter = f;
            render();
        }

        function checkAnswer(idx, chosenIdx, btnEl) {
            const card = document.getElementById(`note-card-${idx}`);
            if (!card || card.dataset.solved === '1') return;

            const notes = getNotes();
            const note = notes[idx];
            if (!note) return;
            if (note.lockedUntil && Date.now() < note.lockedUntil) return; // 잠긴 문제는 클릭 무시

            const feedbackEl = document.getElementById(`note-feedback-${idx}`);

            if (chosenIdx === note.correctIdx) {
                card.dataset.solved = '1';
                card.querySelectorAll('.note-option-btn').forEach(b => b.disabled = true);
                btnEl.classList.add('correct-pick');
                feedbackEl.className = 'note-feedback correct';
                feedbackEl.textContent = `🎉 정답이다냥! 💡 ${note.explanation}`;
                if (typeof recordReviewClear === 'function') recordReviewClear();
                setTimeout(() => {
                    // getNotes()는 매번 JSON.parse로 새 객체를 만들기 때문에
                    // note와 참조가 달라 indexOf로는 절대 못 찾음 -> 내용으로 매칭해야 함
                    const latest = getNotes();
                    const stillIdx = latest.findIndex(n =>
                        n.date === note.date && n.question === note.question && n.url === note.url
                    );
                    if (stillIdx !== -1) {
                        latest.splice(stillIdx, 1);
                    }
                    saveNotes(latest);
                    render();
                }, 1400);
            } else {
                // 오답: 정답/해설을 바로 보여주고, 1분 동안 이 문제를 다시 못 누르게 잠가서
                // 마구 찍어서 우연히 맞히는 걸 막음
                card.querySelectorAll('.note-option-btn').forEach(b => b.disabled = true);
                btnEl.classList.add('wrong-pick');

                const lockedUntil = Date.now() + 60 * 1000;
                const latest = getNotes();
                if (latest[idx]) {
                    latest[idx].lockedUntil = lockedUntil;
                    saveNotes(latest);
                }

                feedbackEl.className = 'note-feedback wrong';
                feedbackEl.innerHTML = `땡! 정답은 <b>${note.options[note.correctIdx]}</b> 이다냥 😿<br>💡 ${note.explanation}<br><span id="lock-timer-${idx}" style="display:inline-block;margin-top:4px;color:#8a8aa8;"></span>`;

                startLockTicker();
                tickLockTimers();
            }
        }

        let lockTickInterval = null;

        function formatRemain(ms) {
            const s = Math.max(0, Math.ceil(ms / 1000));
            return `⏱ ${s}초 후에 다시 풀 수 있어요`;
        }

        function tickLockTimers() {
            const notes = getNotes();
            let anyExpired = false;
            notes.forEach((note, idx) => {
                if (!note.lockedUntil) return;
                const remain = note.lockedUntil - Date.now();
                if (remain <= 0) {
                    anyExpired = true;
                } else {
                    const el = document.getElementById(`lock-timer-${idx}`);
                    if (el) el.textContent = formatRemain(remain);
                }
            });
            if (anyExpired) render();
        }

        function startLockTicker() {
            if (lockTickInterval) return;
            lockTickInterval = setInterval(tickLockTimers, 1000);
        }

        render();
        startLockTicker();
        tickLockTimers();
    </script>
</body>
</html>
