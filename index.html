<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과학 퀴즈 - 8비트 고양이</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #00d4ff;
            --primary-light: #4dd4ff;
            --accent: #00d4ff;
            --success: #00ff88;
            --danger: #ff4466;
            --bg: #2d1f3d;
            --text: #f0f0f0;
        }

        body {
            background: linear-gradient(135deg, #2d1f4e 0%, #1f1447 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Sans KR', sans-serif;
            padding: 1rem;
            color: var(--text);
        }

        .game-container {
            max-width: 500px;
            width: 100%;
            background: #2d1f3d;
            border: none;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 28px;
            color: #00d4ff;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .cat-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            padding: 0.8rem;
            background: transparent;
        }

        .cat-pixel {
            font-size: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cat-happy { animation: bounce 0.6s ease; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .cat-sad { animation: droop 0.6s ease; }
        @keyframes droop {
            0% { transform: translateY(0); }
            50% { transform: translateY(5px) rotateZ(-2deg); }
            100% { transform: translateY(0); }
        }

        .fish-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
        }

        .fish-display {
            display: flex;
            justify-content: center;
            gap: 3px;
            flex-wrap: wrap;
            min-height: 40px;
            align-content: flex-start;
        }

        .fish {
            font-size: 28px;
            animation: popIn 0.4s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .question-box {
            background: transparent;
            border: none;
            border-radius: 15px;
            padding: 1.2rem;
            padding-left: 0;
            padding-right: 0;
            margin-bottom: 1rem;
        }

        .progress {
            font-size: 12px;
            color: var(--primary);
            margin-bottom: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 20px;
            margin-bottom: 1.2rem;
            line-height: 1.8;
            color: #f0f0f0;
            font-weight: 600;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1.2rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: rgba(0, 212, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
            color: #f0f0f0;
        }

        .option:hover {
            background: rgba(0, 212, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.15);
        }

        .option input[type="radio"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .option.correct {
            background: rgba(0, 255, 136, 0.2);
        }

        .option.incorrect {
            background: rgba(255, 68, 102, 0.2);
        }

        .option.disabled {
            pointer-events: none;
        }

        .feedback {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 14px;
            line-height: 1.6;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
            border-left: 4px solid var(--success);
        }

        .feedback.incorrect {
            background: rgba(255, 68, 102, 0.15);
            color: #ff8899;
            border-left: 4px solid var(--danger);
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            padding: 16px;
            border: none;
            background: linear-gradient(135deg, #00d4ff 0%, #00b8d4 100%);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }

        button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.5);
        }

        button:active:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 2px 10px rgba(0, 212, 255, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .game-over {
            text-align: center;
            display: none;
        }

        .final-score {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary);
            margin: 2rem 0 1.5rem 0;
        }

        .final-message {
            font-size: 16px;
            color: #f0f0f0;
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        .fish-total {
            font-size: 24px;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        .fish-total-display {
            display: flex;
            justify-content: center;
            gap: 3px;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        #quiz-section { display: block; }
        #game-over-section { display: none; }

        @media (max-width: 480px) {
            .game-container { padding: 1rem; }
            .header { font-size: 24px; }
            .question-text { font-size: 18px; }
            .option { font-size: 15px; padding: 12px; }
            button { font-size: 15px; padding: 14px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">🎮 과학 퀴즈 게임 🎮</div>

        <!-- 시작 화면 -->
        <div id="start-section" style="text-align: center; padding: 2rem 0;">
            <div style="font-size: 80px; margin-bottom: 1rem;">😸</div>
            <div style="font-size: 16px; color: #b0b0ff; margin-bottom: 2rem; line-height: 1.8;">중학교 과학 중간고사 준비!<br>생식과 유전 · 에너지 전환과 보존</div>
            <button onclick="startGame()" style="font-size: 20px; padding: 18px 40px;">🎮 게임 시작!</button>
        </div>

        <div id="quiz-section" style="display:none;">
            <div class="cat-section">
                <div class="cat-pixel" id="cat">😸</div>
                <div class="fish-section">
                    <div class="fish-display" id="fishDisplay"></div>
                </div>
            </div>

            <div class="question-box">
                <div class="progress">
                    <span id="current-q">1</span> / <span id="total-q">10</span>
                </div>
                <div class="question-text" id="question"></div>
                <div class="options" id="options"></div>
                <div class="feedback" id="feedback"></div>
                <div class="button-group">
                    <button id="submit-btn" onclick="submitAnswer()">정답 제출</button>
                    <button id="next-btn" onclick="nextQuestion()" style="display:none;">다음 문제 →</button>
                </div>
            </div>
        </div>

        <div id="game-over-section" class="game-over">
            <div class="header" style="margin-bottom: 1rem;">🎉 게임 종료! 🎉</div>
            <div class="final-score" id="final-score">0 / 10</div>
            <div class="fish-total">모은 물고기</div>
            <div class="fish-total-display" id="fishTotal"></div>
            <div class="final-message" id="final-message"></div>
            <button onclick="resetGame()">다시 시작하기</button>
        </div>
    </div>

    <!-- 배경음악 -->
    <audio id="bgmAudio" loop>
        <source src="PixelPulse.mp3" type="audio/mpeg">
    </audio>

    <script>
        const bgmAudio = document.getElementById('bgmAudio');
        bgmAudio.volume = 0.3;

        function startGame() {
            document.getElementById('start-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            bgmAudio.play().catch(e => console.log('음악 재생 실패:', e));
            loadQuestion();
        }

        const questions = [
            // 생식과 유전 (5개)
            {
                q: "사람의 체세포가 가진 염색체는 총 몇 개인가요?",
                options: ["23개", "46개", "32개", "64개"],
                correct: 1,
                explanation: "사람의 체세포는 46개의 염색체를 가지고 있습니다. (23쌍)"
            },
            {
                q: "DNA의 기본 구조는 어떤 모양일까요?",
                options: ["원형", "나선형", "직선형", "별 모양"],
                correct: 1,
                explanation: "DNA는 이중나선 구조를 가지고 있습니다."
            },
            {
                q: "멘델의 우성 법칙에서 우성 형질이란?",
                options: ["약한 형질", "강한 형질", "드문 형질", "변한 형질"],
                correct: 1,
                explanation: "우성 형질은 열성 형질보다 더 잘 나타나는 형질입니다."
            },
            {
                q: "유전자가 위치하는 곳은 어디일까요?",
                options: ["세포질", "미토콘드리아", "염색체", "리보솜"],
                correct: 2,
                explanation: "유전자는 세포핵의 염색체 위에 위치합니다."
            },
            {
                q: "같은 부모에서 자식들이 다른 외형을 가지는 이유는?",
                options: ["같은 유전자", "다른 유전자 조합", "다른 식이요법", "다른 환경만"],
                correct: 1,
                explanation: "부모의 여러 유전자가 다양한 조합으로 자식에게 전달됩니다."
            },

            // 에너지 전환과 보존 (5개)
            {
                q: "에너지 보존의 법칙이란?",
                options: ["에너지는 생성된다", "에너지는 소멸한다", "에너지는 형태를 바꿀 뿐 사라지지 않는다", "에너지는 증가한다"],
                correct: 2,
                explanation: "에너지는 한 형태에서 다른 형태로 변환되지만 총량은 일정합니다."
            },
            {
                q: "태양에서 나오는 빛 에너지는 식물에서 주로 어떤 에너지로 전환되나요?",
                options: ["열에너지", "음향에너지", "화학에너지", "운동에너지"],
                correct: 2,
                explanation: "식물은 광합성을 통해 빛 에너지를 화학에너지로 변환합니다."
            },
            {
                q: "전기 모터에서 전기 에너지는 주로 어떤 에너지로 바뀌나요?",
                options: ["빛에너지", "열에너지", "운동에너지", "음향에너지"],
                correct: 2,
                explanation: "모터는 전기 에너지를 운동에너지로 변환합니다."
            },
            {
                q: "다음 중 재생 가능한 에너지는?",
                options: ["석탄", "석유", "태양에너지", "천연가스"],
                correct: 2,
                explanation: "태양에너지는 태양이 존재하는 한 계속 이용할 수 있는 재생 가능한 에너지입니다."
            },
            {
                q: "에너지를 칼로리 단위로 나타낼 때, 어떤 에너지의 척도인가요?",
                options: ["움직임의 크기", "물질의 양", "열의 크기", "빛의 세기"],
                correct: 2,
                explanation: "칼로리는 열에너지를 나타내는 단위입니다."
            }
        ];

        let currentQuestion = 0;
        let correctCount = 0;
        let fishCount = 0;
        let answered = false;
        let selectedOption = null;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question').textContent = q.q;
            document.getElementById('current-q').textContent = currentQuestion + 1;
            document.getElementById('total-q').textContent = questions.length;

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const label = document.createElement('label');
                label.className = 'option';
                label.innerHTML = `
                    <input type="radio" name="answer" value="${idx}" onchange="selectOption(${idx})">
                    <span>${opt}</span>
                `;
                optionsDiv.appendChild(label);
            });

            document.getElementById('feedback').innerHTML = '';
            document.getElementById('feedback').classList.remove('show', 'correct', 'incorrect');
            document.getElementById('submit-btn').style.display = 'block';
            document.getElementById('next-btn').style.display = 'none';
            answered = false;
            selectedOption = null;
        }

        function selectOption(idx) {
            selectedOption = idx;
        }

        function submitAnswer() {
            startBGM(); // 첫 클릭시 음악 시작
            if (selectedOption === null) {
                alert('선택지를 선택해주세요');
                return;
            }

            const q = questions[currentQuestion];
            const isCorrect = selectedOption === q.correct;

            const catEl = document.getElementById('cat');
            const options = document.querySelectorAll('.option');

            if (isCorrect) {
                correctCount++;
                fishCount++;
                catEl.textContent = '😸';
                catEl.classList.add('cat-happy');
                catEl.classList.remove('cat-sad');

                // 물고기 추가
                const fishDisplay = document.getElementById('fishDisplay');
                const fish = document.createElement('span');
                fish.className = 'fish';
                fish.textContent = '🐟';
                fishDisplay.appendChild(fish);

                const feedback = document.getElementById('feedback');
                feedback.className = 'feedback correct show';
                feedback.innerHTML = '✓ 정답입니다!<br>' + q.explanation;
            } else {
                catEl.textContent = '😿';
                catEl.classList.add('cat-sad');
                catEl.classList.remove('cat-happy');

                const feedback = document.getElementById('feedback');
                feedback.className = 'feedback incorrect show';
                feedback.innerHTML = '✗ 오답입니다.<br>' + q.explanation;
            }

            options.forEach((opt, idx) => {
                opt.classList.add('disabled');
                if (idx === q.correct) {
                    opt.classList.add('correct');
                } else if (idx === selectedOption && !isCorrect) {
                    opt.classList.add('incorrect');
                }
            });

            document.getElementById('submit-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'block';
            answered = true;
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }

        function endGame() {
            document.getElementById('quiz-section').style.display = 'none';
            document.getElementById('game-over-section').style.display = 'block';

            document.getElementById('final-score').textContent = correctCount + ' / ' + questions.length;

            // 물고기 표시
            const fishTotalDiv = document.getElementById('fishTotal');
            fishTotalDiv.innerHTML = '';
            for (let i = 0; i < fishCount; i++) {
                const fish = document.createElement('span');
                fish.className = 'fish';
                fish.textContent = '🐟';
                fishTotalDiv.appendChild(fish);
            }

            let message = '';
            if (correctCount === questions.length) {
                message = '완벽합니다! 🌟 과학의 신이 되었어요!\n중간고사 대비 완벽합니다!';
            } else if (correctCount >= questions.length * 0.8) {
                message = '훌륭합니다! 📚 과학을 정말 잘 이해하고 있네요.\n중간고사에서 좋은 성적을 기대해요!';
            } else if (correctCount >= questions.length * 0.6) {
                message = '좋습니다! 💪 좀 더 복습하면 더 잘할 수 있어요.\n중요한 개념들을 다시 한번 정리해봐요!';
            } else {
                message = '화이팅! ✨ 다시 한 번 도전해보세요.\n어려운 부분들을 다시 공부해봅시다!';
            }
            document.getElementById('final-message').textContent = message;
        }

        function resetGame() {
            currentQuestion = 0;
            correctCount = 0;
            fishCount = 0;
            answered = false;
            selectedOption = null;
            document.getElementById('start-section').style.display = 'block';
            document.getElementById('quiz-section').style.display = 'none';
            document.getElementById('game-over-section').style.display = 'none';
            document.getElementById('fishDisplay').innerHTML = '';
        }
    </script>
</body>
</html>
