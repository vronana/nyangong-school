<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과학 퀴즈 허브</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #00d4ff;
            --text: #f0f0f0;
        }

        html, body {
            height: 100%;
            background: #1f1447;
            font-family: 'Noto Sans KR', sans-serif;
            color: var(--text);
        }

        #content-frame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #2d1f3d;
            border-radius: 20px;
            padding: 2rem 1.5rem;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 0.6rem; }
        .modal-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: #1a1230;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="modal-overlay show" id="name-modal">
        <div class="modal-box">
            <div style="font-size:50px; margin-bottom:0.8rem;">😸</div>
            <div id="name-modal-new">
                <div class="modal-title" style="color:#00d4ff;">이름(별명)을 알려줘!</div>
                <div style="font-size:13px; color:#b0b0ff; margin-bottom:1rem;">랭킹에 이 이름으로 표시돼요 🏆</div>
                <input type="text" id="name-input" placeholder="예: 나나" maxlength="10"
                    onkeypress="if(event.key==='Enter') confirmName()"
                    style="width:100%; padding:12px; border-radius:10px; border:1px solid #4a3a6a; background:#1f1730; color:#f0f0f0; font-size:15px; margin-bottom:1rem; text-align:center; box-sizing:border-box;">
                <button class="modal-btn" onclick="confirmName()">확인</button>
            </div>
            <div id="name-modal-returning" style="display:none;">
                <div class="modal-title" id="welcome-title" style="color:#00d4ff;"></div>
                <div style="font-size:13px; color:#b0b0ff; margin-bottom:1.2rem;">오늘도 화이팅! 🔥</div>
                <button class="modal-btn" onclick="enterHub()">🎮 시작하기</button>
            </div>
        </div>
    </div>

    <audio id="bgmAudio" loop>
        <source src="PixelPulse.mp3" type="audio/mpeg">
    </audio>

    <iframe id="content-frame" src="hub.html" title="과학 퀴즈 허브"></iframe>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script>
        // 이 페이지(index.html)는 절대 다시 불러오지 않는 "셸"이야.
        // 실제 화면(허브/퀴즈/오답노트/랭킹)은 전부 아래 iframe 안에서 바뀌기 때문에
        // 음악이 한 번 재생되면 어떤 화면으로 이동해도 끊기지 않고, 팝업도 한 번만 떠.
        function playBgm() {
            const audio = document.getElementById('bgmAudio');
            if (audio) audio.play().catch(e => console.log('음악 재생 실패:', e));
        }

        function initNameGate() {
            const existing = localStorage.getItem('sciencePlayerName_v2');
            if (existing) {
                registerPlayer(existing);
                document.getElementById('name-modal-new').style.display = 'none';
                document.getElementById('name-modal-returning').style.display = 'block';
                document.getElementById('welcome-title').textContent = `${existing}님 반가워요! 😸`;
            } else {
                document.getElementById('name-modal-new').style.display = 'block';
                document.getElementById('name-modal-returning').style.display = 'none';
            }
        }

        function enterHub() {
            document.getElementById('name-modal').classList.remove('show');
            playBgm();
        }

        function confirmName() {
            const input = document.getElementById('name-input');
            const val = input.value.trim();
            if (!val) { alert('이름을 입력해줘!'); return; }
            localStorage.setItem('sciencePlayerName_v2', val);
            registerPlayer(val);
            document.getElementById('name-modal').classList.remove('show');
            playBgm();
        }

        initNameGate();
    </script>
</body>
</html>
