<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냥공스쿨</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-top: #14121f;
            --bg-bottom: #0c0b14;
            --surface: #1d1b2e;
            --surface-soft: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #8b93ff;
            --primary-soft: rgba(139, 147, 255, 0.16);
            --success: #4ade80;
            --danger: #ff7a90;
            --gold: #f0c14b;
            --text: #edecf6;
            --text-muted: #9794b8;
        }

        body {
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            padding: 1.5rem 1rem 3rem;
            color: var(--text);
        }

        .wrap {
            max-width: 640px;
            margin: 0 auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 1.8rem;
        }
        .hero .cat {
            font-size: 60px;
            margin-bottom: 0.5rem;
        }
        .hero h1 {
            font-size: 25px;
            color: var(--text);
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 0.4rem;
        }
        .hero p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .share-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 1.6rem;
        }
        .share-row .share-text {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .share-row .share-btn {
            flex-shrink: 0;
            background: var(--primary);
            color: #14122a;
            border: none;
            border-radius: 10px;
            padding: 9px 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
        }
        .share-row .share-btn:active { transform: scale(0.95); }

        .notes-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 1.2rem;
            text-decoration: none;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.15s;
        }
        .notes-link:active { transform: scale(0.98); }
        .notes-link .badge {
            background: var(--danger);
            color: #2a1420;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 700;
        }

        .section-title {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
            margin: 1.8rem 0 0.7rem;
            padding-left: 4px;
            letter-spacing: 0.5px;
        }
        .section-title:first-of-type { margin-top: 0; }

        .subject-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .subject-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 6px;
            background: var(--surface);
            border-radius: 18px;
            padding: 1.6rem 1rem;
            text-decoration: none;
            color: var(--text);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            transition: transform 0.15s, border-color 0.15s;
            min-height: 130px;
            position: relative;
            cursor: pointer;
        }
        .subject-card:active { transform: scale(0.97); }
        .subject-card .icon { font-size: 34px; }
        .subject-card .name {
            font-size: 15px;
            font-weight: 700;
        }
        .subject-card .desc {
            font-size: 11px;
            color: var(--text-muted);
        }

        a.subject-card {
            border-color: var(--primary-soft);
        }
        a.subject-card:hover { border-color: rgba(139, 147, 255, 0.5); }

        .subject-card.soon {
            opacity: 0.55;
            filter: grayscale(0.5);
        }
        .subject-card .soon-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(240, 193, 75, 0.15);
            color: var(--gold);
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 10px;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2.5rem;
            line-height: 1.7;
        }

        @media (max-width: 380px) {
            .subject-grid { grid-template-columns: 1fr 1fr; }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem 1.5rem;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 0.6rem; color: var(--text); }
        .modal-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: #14122a;
            cursor: pointer;
        }

        .greeting {
            text-align: center;
            font-size: 14px;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 0.6rem;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 32px;
            transform: translateX(-50%) translateY(20px);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 6px 24px rgba(0,0,0,0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 300;
            max-width: 85%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .version-tag {
            position: fixed;
            right: 10px;
            bottom: 6px;
            font-size: 10px;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 8px;
            border-radius: 8px;
            z-index: 999;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="version-tag">v2026.09.27-6</div>
    <div class="modal-overlay" id="name-modal">
        <div class="modal-box">
            <div style="font-size:50px; margin-bottom:0.8rem;">😸</div>
            <div id="name-modal-new">
                <div class="modal-title">이름(별명)을 알려주냥!</div>
                <div style="font-size:13px; color:var(--text-muted); margin-bottom:1rem;">랭킹에 이 이름으로 표시된다냥 🏆</div>
                <input type="text" id="name-input" placeholder="예: 나나" maxlength="10"
                    onkeypress="if(event.key==='Enter') confirmName()"
                    style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:var(--bg-top); color:var(--text); font-size:15px; margin-bottom:1rem; text-align:center; box-sizing:border-box;">
                <button class="modal-btn" onclick="confirmName()">확인</button>
            </div>
            <div id="name-modal-returning" style="display:none;">
                <div class="modal-title" id="welcome-title"></div>
                <div style="font-size:13px; color:var(--text-muted); margin-bottom:1.2rem;">오늘도 화이팅이다냥! 🔥</div>
                <button class="modal-btn" onclick="enterHub()">🎮 시작하기</button>
            </div>
        </div>
    </div>

    <audio id="bgmAudio" loop>
        <source src="PixelPulse.mp3" type="audio/mpeg">
    </audio>

    <div class="wrap">
        <div class="hero">
            <div class="cat">😸</div>
            <h1>냥공스쿨</h1>
            <div class="greeting" id="hub-greeting"></div>
        </div>

        <div class="share-row">
            <span class="share-text">친구에게 공유해보냥 😸</span>
            <button type="button" class="share-btn" onclick="shareSite()">📤 공유하기</button>
        </div>

        <div class="section-title">📚 과목을 골라보냥</div>
        <div class="subject-grid">
            <a href="science-hub.html" class="subject-card">
                <div class="icon">🔬</div>
                <div class="name">과학</div>
                <div class="desc">150문제 · 3단계</div>
            </a>
            <div class="subject-card soon" onclick="comingSoon('사회')">
                <span class="soon-badge">곧 만나요</span>
                <div class="icon">🌍</div>
                <div class="name">사회</div>
                <div class="desc">준비 중</div>
            </div>
            <div class="subject-card soon" onclick="comingSoon('영어')">
                <span class="soon-badge">곧 만나요</span>
                <div class="icon">🔤</div>
                <div class="name">영어</div>
                <div class="desc">준비 중</div>
            </div>
            <div class="subject-card soon" onclick="comingSoon('수학')">
                <span class="soon-badge">곧 만나요</span>
                <div class="icon">➗</div>
                <div class="name">수학</div>
                <div class="desc">준비 중</div>
            </div>
        </div>

        <div class="footer-note">
            틀린 문제는 자동으로 오답노트에 저장된다냥 🐟<br>
            중간고사 화이팅이다냥!
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="bgm-continuity.js"></script>
    <script>
        // index.html(셸)의 iframe 안에서 열린 경우엔 음악/팝업을 셸이 이미 처리하고 있으니 건드리지 않음.
        // 이 페이지를 직접 열었을 때(공유 링크 등)만 예전처럼 자체적으로 음악과 팝업을 관리함.
        const embedded = window.top !== window.self;

        if (!embedded) {
            initBgmContinuity(document.getElementById('bgmAudio'));
        }

        function getSavedName() {
            try { return localStorage.getItem('sciencePlayerName_v2') || ''; }
            catch (e) { return ''; }
        }
        const greetingLines = [
            name => `어서 와 ${name}, 중3 중간고사 고민되냥? 이거 풀어봐라! 😼`,
            name => `${name} 왔구나! 중간고사 전에 한 문제라도 더 풀어보자냥 💪`,
            name => `오늘도 냥공하러 온 ${name}, 기특하다냥! 얼른 시작해보냥 📚`,
            name => `${name}야 반갑다냥! 시험 코앞인데 여기서 감 잡고 가라냥 🔥`,
            name => `${name}, 잘 왔다냥! 오늘은 몇 문제 풀고 갈 거냥? 😸`
        ];
        function updateGreeting() {
            const name = getSavedName();
            const el = document.getElementById('hub-greeting');
            if (!el) return;
            if (!name) { el.textContent = ''; return; }
            const pick = greetingLines[Math.floor(Math.random() * greetingLines.length)];
            el.textContent = pick(name);
        }
        function playBgm() {
            const audio = document.getElementById('bgmAudio');
            if (audio) audio.play().catch(e => console.log('음악 재생 실패:', e));
        }
        function initNameGate() {
            const existing = localStorage.getItem('sciencePlayerName_v2');

            if (embedded) {
                // 부모(index.html)가 이미 이름 입력/음악 재생을 처리했음. 여기선 등록만 확인.
                if (existing) registerPlayer(existing);
                return;
            }

            document.getElementById('name-modal').classList.add('show');
            if (existing) {
                registerPlayer(existing);
                document.getElementById('name-modal-new').style.display = 'none';
                document.getElementById('name-modal-returning').style.display = 'block';
                document.getElementById('welcome-title').textContent = `${existing}님 반갑다냥! 😸`;
            } else {
                document.getElementById('name-modal-new').style.display = 'block';
                document.getElementById('name-modal-returning').style.display = 'none';
            }
        }
        function enterHub() {
            document.getElementById('name-modal').classList.remove('show');
            playBgm();
            updateGreeting();
        }
        function confirmName() {
            const input = document.getElementById('name-input');
            const val = input.value.trim();
            if (!val) { alert('이름을 입력해달라냥!'); return; }
            localStorage.setItem('sciencePlayerName_v2', val);
            registerPlayer(val);
            document.getElementById('name-modal').classList.remove('show');
            playBgm();
            updateGreeting();
        }
        initNameGate();
        updateGreeting();

        let toastTimer = null;
        function comingSoon(subject) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = `${subject}는 아직 공부 중이다냥! 조금만 기다려줘 😸`;
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function shareSite() {
            const shareUrl = 'https://vronana.github.io/nyangong-school/';
            const shareData = {
                title: '냥공스쿨',
                text: '중간고사 준비, 냥공스쿨이랑 같이 하자! 🐱📚',
                url: shareUrl
            };
            if (navigator.share) {
                navigator.share(shareData).catch(() => {});
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(shareUrl)
                    .then(() => showToast('링크를 복사했다냥! 친구한테 붙여넣기 해서 보내보냥 📋'))
                    .catch(() => showToast(shareUrl));
            } else {
                showToast(shareUrl);
            }
        }
    </script>
</body>
</html>
