<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냥공스쿨 · 사회 랭킹</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-top: #14121f;
            --bg-bottom: #0c0b14;
            --surface: #262340;
            --surface-soft: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.11);
            --primary: #8b93ff;
            --primary-soft: rgba(139, 147, 255, 0.2);
            --success: #4ade80;
            --danger: #ff7a90;
            --gold: #f0c14b;
            --text: #f5f4fb;
            --text-muted: #a5a2c4;
        }

        body {
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            padding: 1.5rem 1rem 3rem;
            color: var(--text);
        }

        .wrap {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 0.4rem;
            font-size: 26px;
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 1px;
        }
        .sub {
            text-align: center;
            color: #a5a2c4;
            font-size: 14px;
            margin-bottom: 1.5rem;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 1.2rem;
            background: #262340;
            border-radius: 14px;
            padding: 4px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            color: #a5a2c4;
        }
        .tab.active {
            background: var(--primary);
            color: #0c0b14;
        }

        .quiz-select {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            background: #262340;
            border: 1px solid rgba(255,255,255,0.11);
            color: var(--text);
            font-size: 13px;
            margin-bottom: 1.2rem;
            display: none;
        }
        .quiz-select.show { display: block; }

        .loading, .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #a5a2c4;
        }
        .empty-state .icon { font-size: 50px; margin-bottom: 1rem; }

        .rank-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #262340;
            border-radius: 14px;
            padding: 0.9rem 1rem;
            margin-bottom: 8px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.25);
        }
        .rank-row.top1 { border: 1px solid rgba(255, 215, 0, 0.5); background: linear-gradient(135deg, #262340, #3a3320); }
        .rank-row.top2 { border: 1px solid rgba(192, 192, 192, 0.4); }
        .rank-row.top3 { border: 1px solid rgba(205, 127, 50, 0.4); }

        .rank-num {
            font-size: 18px;
            font-weight: 700;
            width: 32px;
            text-align: center;
            flex-shrink: 0;
        }
        .rank-info { flex: 1; min-width: 0; }
        .rank-name {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rank-name .crown {
            margin-right: 3px;
        }
        .rank-detail {
            font-size: 11px;
            color: #8985a8;
            margin-top: 2px;
        }
        .rank-score {
            font-size: 16px;
            font-weight: 700;
            color: var(--success);
            flex-shrink: 0;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #6f6c8c;
            margin-top: 2rem;
            line-height: 1.7;
        }
        .footer-note a { color: var(--primary); text-decoration: none; }
        .home-float {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 150;
            background: rgba(45, 31, 61, 0.9);
            color: #8b93ff;
            border: 1px solid rgba(255,255,255,0.11);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }
        .version-tag {
            position: fixed;
            right: 10px;
            bottom: 6px;
            font-size: 10px;
            color: #a5a2c4;
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 8px;
            border-radius: 8px;
            z-index: 999;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="version-tag">v2026.09.27-20</div>
    <a href="society-hub.html" class="home-float">🏠 홈</a>
    <div class="wrap">
        <div class="header">🏆 랭킹 🏆</div>
        <div class="sub">친구들이랑 점수로 겨뤄보냥!</div>
        <div class="sub" id="page-greeting" style="color:var(--primary); font-weight:600;"></div>

        <div class="tabs">
            <div class="tab active" data-mode="total" onclick="setMode('total')">전체 누적 점수</div>
            <div class="tab" data-mode="quiz" onclick="setMode('quiz')">퀴즈별 최고점</div>
        </div>

        <select class="quiz-select" id="quiz-select" onchange="renderQuizRanking()"></select>

        <div id="content">
            <div class="loading">불러오는 중... ⏳</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script>
        function updateGreeting() {
            try {
                const name = localStorage.getItem('sciencePlayerName_v2') || '';
                const el = document.getElementById('page-greeting');
                if (el) el.textContent = name ? `${name}님 반갑다냥! 😸` : '';
            } catch (e) {}
        }
        updateGreeting();

        let mode = 'total';
        let allScores = [];
        let allPlayers = []; // { name, reviewCleared }

        const quizTitles = {
            'international.html': '국제 사회와 국제 정치 기초',
            'city.html': '사람이 만든 삶터, 도시 기초',
            'territory.html': '세계 속의 우리나라 기초',
            'international-adv.html': '국제 사회와 국제 정치 응용',
            'city-adv.html': '사람이 만든 삶터, 도시 응용',
            'territory-adv.html': '세계 속의 우리나라 응용',
            'international-master.html': '국제 사회와 국제 정치 심화',
            'city-master.html': '사람이 만든 삶터, 도시 심화',
            'territory-master.html': '세계 속의 우리나라 심화',
            'international-city.html': '국제 사회·도시 종합',
            'city-territory.html': '도시·영역 종합',
            'society-review.html': '단원 통합 모음',
            'society-advanced-all.html': '전 단원 통합 심화',
            'society-main-quiz.html': '전체 종합 퀴즈'
        };

        function setMode(m) {
            mode = m;
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === m));
            document.getElementById('quiz-select').classList.toggle('show', m === 'quiz');
            render();
        }

        function medalFor(rank) {
            if (rank === 0) return '🥇';
            if (rank === 1) return '🥈';
            if (rank === 2) return '🥉';
            return (rank + 1) + '.';
        }

        function rowClass(rank) {
            if (rank === 0) return 'rank-row top1';
            if (rank === 1) return 'rank-row top2';
            if (rank === 2) return 'rank-row top3';
            return 'rank-row';
        }

        function renderTotalRanking() {
            const content = document.getElementById('content');
            if (allScores.length === 0 && allPlayers.length === 0) {
                content.innerHTML = `<div class="empty-state"><div class="icon">🐟</div>아직 아무도 없다냥!<br>가장 먼저 이름 등록하고 1등 해보냥.</div>`;
                return;
            }

            // 이름 등록한 사람 전원을 0점으로 먼저 깔아두고 시작
            const byPlayer = {};
            allPlayers.forEach(p => {
                byPlayer[p.name] = { name: p.name, bestByQuiz: {}, reviewCleared: p.reviewCleared || 0, masterTitle: !!p.masterTitle };
            });
            // 같은 퀴즈를 여러 번 풀었으면 그중 제일 잘 본 기록만 반영 (중복 방지)
            allScores.forEach(s => {
                if (!byPlayer[s.name]) byPlayer[s.name] = { name: s.name, bestByQuiz: {}, reviewCleared: 0 };
                const best = byPlayer[s.name].bestByQuiz[s.quizFile];
                if (!best || s.correct > best.correct) {
                    byPlayer[s.name].bestByQuiz[s.quizFile] = { correct: s.correct, total: s.total };
                }
            });

            const ranked = Object.values(byPlayer).map(p => {
                const quizzes = Object.values(p.bestByQuiz);
                const quizCorrect = quizzes.reduce((sum, q) => sum + q.correct, 0);
                const quizTotal = quizzes.reduce((sum, q) => sum + q.total, 0);
                const score = quizCorrect + p.reviewCleared;
                return {
                    name: p.name,
                    score,
                    quizCount: quizzes.length,
                    quizCorrect,
                    quizTotal,
                    reviewCleared: p.reviewCleared,
                    masterTitle: p.masterTitle
                };
            }).sort((a, b) => b.score - a.score);

            let html = '';
            ranked.forEach((p, i) => {
                let detail;
                if (p.quizCount === 0 && p.reviewCleared === 0) {
                    detail = '아직 퀴즈 안 풀었다냥';
                } else {
                    const pct = p.quizTotal > 0 ? Math.round((p.quizCorrect / p.quizTotal) * 100) : 0;
                    detail = `${p.quizCount}개 퀴즈 완료 · 정답률 ${pct}%`;
                    if (p.reviewCleared > 0) detail += ` · 오답 복습 ${p.reviewCleared}개`;
                }
                html += `
                    <div class="${rowClass(i)}">
                        <div class="rank-num">${medalFor(i)}</div>
                        <div class="rank-info">
                            <div class="rank-name">${p.masterTitle ? '<span class="crown" title="냥공 마스터">👑</span>' : ''}${escapeHtml(p.name)}</div>
                            <div class="rank-detail">${detail}</div>
                        </div>
                        <div class="rank-score">${p.score}점</div>
                    </div>
                `;
            });
            content.innerHTML = html;
        }

        function renderQuizRanking() {
            const content = document.getElementById('content');
            const select = document.getElementById('quiz-select');
            const selected = select.value;

            const filtered = allScores.filter(s => s.quizFile === selected);
            if (filtered.length === 0) {
                content.innerHTML = `<div class="empty-state"><div class="icon">🐟</div>이 퀴즈는 아직 아무도 안 풀었다냥!</div>`;
                return;
            }

            // 사람별 최고점만
            const bestByPlayer = {};
            filtered.forEach(s => {
                if (!bestByPlayer[s.name] || s.correct > bestByPlayer[s.name].correct) {
                    bestByPlayer[s.name] = s;
                }
            });
            const ranked = Object.values(bestByPlayer).sort((a, b) => b.correct - a.correct);
            const masterNames = new Set(allPlayers.filter(p => p.masterTitle).map(p => p.name));

            let html = '';
            ranked.forEach((s, i) => {
                const crown = masterNames.has(s.name) ? '<span class="crown" title="냥공 마스터">👑</span>' : '';
                html += `
                    <div class="${rowClass(i)}">
                        <div class="rank-num">${medalFor(i)}</div>
                        <div class="rank-info">
                            <div class="rank-name">${crown}${escapeHtml(s.name)}</div>
                        </div>
                        <div class="rank-score">${s.correct} / ${s.total}</div>
                    </div>
                `;
            });
            content.innerHTML = html;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function populateQuizSelect() {
            const select = document.getElementById('quiz-select');
            const usedFiles = [...new Set(allScores.map(s => s.quizFile))];
            select.innerHTML = usedFiles.map(f => `<option value="${f}">${quizTitles[f] || f}</option>`).join('');
        }

        function render() {
            if (mode === 'total') {
                renderTotalRanking();
            } else {
                populateQuizSelect();
                renderQuizRanking();
            }
        }

        Promise.all([
            db.collection('scores').orderBy('timestamp', 'desc').limit(1000).get(),
            db.collection('players').limit(1000).get()
        ]).then(([scoreSnap, playerSnap]) => {
            allScores = scoreSnap.docs.map(doc => doc.data());
            allPlayers = playerSnap.docs.map(doc => {
                const d = doc.data();
                return { name: d.name, reviewCleared: d.reviewCleared || 0, masterTitle: !!d.masterTitle };
            });
            render();
        }).catch(e => {
            document.getElementById('content').innerHTML =
                `<div class="empty-state"><div class="icon">⚠️</div>랭킹을 불러오지 못했다냥.<br><span style="font-size:11px">${e.message}</span></div>`;
        });
    </script>
</body>
</html>
