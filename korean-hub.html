<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냥공스쿨 · 국어</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-top: #14121f;
            --bg-bottom: #0c0b14;
            --surface: #262340;
            --surface-soft: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.11);
            --primary: #8b93ff;
            --primary-soft: rgba(139, 147, 255, 0.2);
            --success: #4ade80;
            --danger: #ff7a90;
            --gold: #f0c14b;
            --text: #f5f4fb;
            --text-muted: #a5a2c4;
        }

        body {
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            padding: 1.5rem 1rem 3rem;
            color: var(--text);
        }

        .wrap {
            max-width: 640px;
            margin: 0 auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 1.8rem;
        }
        .home-float {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 150;
            background: rgba(45, 31, 61, 0.9);
            color: #8b93ff;
            border: 1px solid rgba(255,255,255,0.11);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }
        .hero .cat {
            font-size: 48px;
            margin-bottom: 0.4rem;
        }
        .hero h1 {
            font-size: 22px;
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 0.4rem;
        }
        .hero p {
            color: #a5a2c4;
            font-size: 14px;
        }

        .notes-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #262340;
            border: 1px solid rgba(255,255,255,0.11);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 1.8rem;
            text-decoration: none;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.15s;
        }
        .notes-link:active { transform: scale(0.98); }
        .notes-link .badge {
            background: var(--danger);
            color: #fff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 700;
        }

        .section-title {
            font-size: 14px;
            color: #a5a2c4;
            font-weight: 700;
            margin: 1.6rem 0 0.7rem;
            padding-left: 4px;
            letter-spacing: 0.5px;
        }
        .section-title:first-of-type { margin-top: 0; }

        .quiz-card-single {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: #262340;
            border-radius: 20px;
            padding: 2rem 1.2rem;
            text-decoration: none;
            color: var(--text);
            box-shadow: 0 4px 24px rgba(0, 212, 255, 0.15);
            border: 1px solid rgba(139, 147, 255, 0.25);
            transition: transform 0.15s;
        }
        .quiz-card-single:active { transform: scale(0.98); }
        .quiz-card-single .icon { font-size: 44px; margin-bottom: 0.7rem; }
        .quiz-card-single .name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }
        .quiz-card-single .desc {
            font-size: 13px;
            color: #a5a2c4;
            margin-bottom: 0.8rem;
        }
        .quiz-card-single .count {
            font-size: 12px;
            color: var(--primary);
            font-weight: 700;
            background: rgba(139, 147, 255, 0.15);
            padding: 4px 12px;
            border-radius: 12px;
        }
        .quiz-card-single .score-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(0, 255, 136, 0.15);
            color: var(--success);
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 10px;
        }
        .quiz-card-single .score-badge.perfect {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.28), rgba(255, 180, 0, 0.2));
            color: #f0c14b;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.35);
        }

        .type-note {
            text-align: center;
            font-size: 12px;
            color: #8985a8;
            margin-bottom: 1.6rem;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #6f6c8c;
            margin-top: 2.5rem;
            line-height: 1.7;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #262340;
            border-radius: 20px;
            padding: 2rem 1.5rem;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 0.6rem; }
        .modal-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: #0c0b14;
            cursor: pointer;
        }

        .greeting {
            text-align: center;
            font-size: 14px;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 0.6rem;
        }
        .version-tag {
            position: fixed;
            right: 10px;
            bottom: 6px;
            font-size: 10px;
            color: #a5a2c4;
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 8px;
            border-radius: 8px;
            z-index: 999;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="version-tag">v2026.10.01-22</div>
    <a href="hub.html" class="home-float">🏠 홈</a>
    <div class="modal-overlay" id="name-modal">
        <div class="modal-box">
            <div style="font-size:50px; margin-bottom:0.8rem;">😸</div>
            <div id="name-modal-new">
                <div class="modal-title" style="color:#8b93ff;">이름(별명)을 알려주냥!</div>
                <div style="font-size:13px; color:#a5a2c4; margin-bottom:1rem;">랭킹에 이 이름으로 표시된다냥 🏆</div>
                <input type="text" id="name-input" placeholder="예: 나나" maxlength="10"
                    onkeypress="if(event.key==='Enter') confirmName()"
                    style="width:100%; padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,0.11); background:#14121f; color:#f5f4fb; font-size:15px; margin-bottom:1rem; text-align:center; box-sizing:border-box;">
                <button class="modal-btn" onclick="confirmName()">확인</button>
            </div>
            <div id="name-modal-returning" style="display:none;">
                <div class="modal-title" id="welcome-title" style="color:#8b93ff;"></div>
                <div style="font-size:13px; color:#a5a2c4; margin-bottom:1.2rem;">오늘도 화이팅이다냥! 🔥</div>
                <button class="modal-btn" onclick="enterHub()">🎮 시작하기</button>
            </div>
        </div>
    </div>

    <audio id="bgmAudio" loop>
        <source src="PixelPulse.mp3" type="audio/mpeg">
    </audio>

    <div class="wrap">
        <div class="hero">
            <div class="cat">📖</div>
            <h1>국어</h1>
            <p>기억 속의 들꽃 어휘 · 63문제 전체 수록</p>
            <div class="greeting" id="hub-greeting"></div>
        </div>

        <a href="korean-wrong-notes.html" class="notes-link">
            📓 오답노트 보기
            <span class="badge">복습</span>
        </a>
        <a href="korean-ranking.html" class="notes-link">
            🏆 랭킹 보기
            <span class="badge" style="background:var(--gold, #f0c14b); color:#3a2a00;">경쟁</span>
        </a>

        <div class="section-title">✏️ 어휘 뜻풀이 주관식 (63문제)</div>
        <div class="type-note">뜻풀이를 보고 알맞은 낱말을 직접 입력하는 문제다냥!</div>
        <a href="quiz-engine.html?id=korean-vocab&subject=korean" class="quiz-card-single" data-file="korean-vocab.html">
            <div class="icon">📖</div>
            <div class="name">기억 속의 들꽃 어휘</div>
            <div class="desc">1~63번 전체 · 뜻풀이 보고 낱말 쓰기</div>
            <div class="count">63문제</div>
        </a>

        <div class="footer-note">
            뜻풀이를 보고 정답 낱말을 직접 입력한다냥. 띄어쓰기 차이는 괜찮지만<br>그 외엔 정확히 써야 정답으로 인정된다냥 🐟
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="bgm-continuity.js"></script>
    <script>
        // index.html(셸)의 iframe 안에서 열린 경우엔 음악/팝업을 셸이 이미 처리하고 있으니 건드리지 않음.
        // 이 페이지를 직접 열었을 때(공유 링크 등)만 예전처럼 자체적으로 음악과 팝업을 관리함.
        const embedded = window.top !== window.self;

        if (!embedded) {
            initBgmContinuity(document.getElementById('bgmAudio'));
        }

        function getSavedName() {
            try { return localStorage.getItem('sciencePlayerName_v2') || ''; }
            catch (e) { return ''; }
        }
        function updateGreeting() {
            const name = getSavedName();
            const el = document.getElementById('hub-greeting');
            if (el) el.textContent = name ? `${name}님 반갑다냥! 😸` : '';
        }
        function playBgm() {
            const audio = document.getElementById('bgmAudio');
            if (audio) audio.play().catch(e => console.log('음악 재생 실패:', e));
        }
        function initNameGate() {
            const existing = localStorage.getItem('sciencePlayerName_v2');

            if (embedded) {
                // 부모(index.html)가 이미 이름 입력/음악 재생을 처리했음. 여기선 등록만 확인.
                if (existing) registerPlayer(existing);
                return;
            }

            document.getElementById('name-modal').classList.add('show');
            if (existing) {
                registerPlayer(existing);
                document.getElementById('name-modal-new').style.display = 'none';
                document.getElementById('name-modal-returning').style.display = 'block';
                document.getElementById('welcome-title').textContent = `${existing}님 반갑다냥! 😸`;
            } else {
                document.getElementById('name-modal-new').style.display = 'block';
                document.getElementById('name-modal-returning').style.display = 'none';
            }
        }
        function enterHub() {
            document.getElementById('name-modal').classList.remove('show');
            playBgm();
            updateGreeting();
        }
        function confirmName() {
            const input = document.getElementById('name-input');
            const val = input.value.trim();
            if (!val) { alert('이름을 입력해달라냥!'); return; }
            localStorage.setItem('sciencePlayerName_v2', val);
            registerPlayer(val);
            document.getElementById('name-modal').classList.remove('show');
            playBgm();
            updateGreeting();
        }
        initNameGate();
        updateGreeting();

        function getProgress() {
            try {
                return JSON.parse(localStorage.getItem('koreanQuizProgress_v2') || '{}');
            } catch (e) { return {}; }
        }

        // 이미 푼 퀴즈는 "완료" 같은 텍스트 대신, 카드에 최고 점수를 배지로 붙여줌 (예: 58/63)
        function renderScoreBadges() {
            const progress = getProgress();
            document.querySelectorAll('.quiz-card-single[data-file]').forEach(card => {
                const file = card.dataset.file;
                const entry = progress[file];
                if (!entry) return;

                let label = '✔';
                let perfect = false;
                if (typeof entry === 'object' && typeof entry.correct === 'number' && typeof entry.total === 'number') {
                    perfect = entry.total > 0 && entry.correct === entry.total;
                    label = perfect ? `🌟 만점 ${entry.correct}/${entry.total}` : `${entry.correct}/${entry.total}`;
                }

                let badge = card.querySelector('.score-badge');
                if (!badge) {
                    badge = document.createElement('div');
                    badge.className = 'score-badge';
                    card.appendChild(badge);
                }
                badge.textContent = label;
                badge.classList.toggle('perfect', perfect);
            });
        }

        renderScoreBadges();
    </script>
</body>
</html>
